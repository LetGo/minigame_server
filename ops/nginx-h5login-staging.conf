# Include INSIDE the existing HTTPS server for sub2api.wdaveh5game.com.
# Separate public prefix; only this prefix is rewritten to the app's /h5login/.
location = /h5login-test {
    mirror off;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Minigame-Environment "staging" always;
    return 308 /h5login-test/;
}
location ^~ /h5login-test/api/data/ {
    mirror off;
    access_log off;
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:18741/h5login/api/data/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_cache off;
    add_header X-Minigame-Environment "staging" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
location ^~ /h5login-test/ {
    mirror off;
    access_log off;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:18741/h5login/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_cache off;
    add_header X-Minigame-Environment "staging" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
